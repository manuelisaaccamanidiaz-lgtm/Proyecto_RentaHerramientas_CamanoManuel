<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes · RentaHerramientas</title>
  <meta name="description" content="Reservas de tus herramientas.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/paginas/proveedor-solicitudes.js"></script>
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="encabezado"></header>

  <main id="contenido" class="pagina contenedor" tabindex="-1">
    <div class="encabezado-pagina">
      <div>
        <h1>Solicitudes de reserva</h1>
        <p>Acepta o rechaza solicitudes, confirma pagos en efectivo y registra entregas, devoluciones y daños.</p>
      </div>
    </div>

    <form id="filtros" class="tarjeta filtros" role="search" aria-label="Filtros">
      <div class="campo">
        <label for="f-estado">Estado</label>
        <select id="f-estado" name="estado" class="input"><option value="">Todos los estados</option><option value="PENDIENTE">Pendiente</option><option value="ACEPTADA">Aceptada</option><option value="ENTREGADA">Entregada</option><option value="DEVUELTA">Devuelta</option><option value="RECHAZADA">Rechazada</option><option value="VENCIDA">Vencida</option></select>
      </div>
    </form>
    <section style="margin-top:1.5rem" aria-label="Listado de solicitudes"><div id="lista"></div></section>
  </main>

  <footer id="pie"></footer>
</body>
</html>
