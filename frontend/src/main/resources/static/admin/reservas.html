<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas · RentaHerramientas</title>
  <meta name="description" content="Historial de reservas con filtros y reportes de daño.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/paginas/admin-reservas.js"></script>
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="encabezado"></header>

  <main id="contenido" class="pagina contenedor" tabindex="-1">
    <div class="encabezado-pagina">
      <div>
        <h1>Reservas</h1>
        <p>Historial completo con filtros. Las fechas buscan reservas que se cruzan con el periodo.</p>
      </div>
    </div>

    <form id="filtros" class="tarjeta filtros" role="search" aria-label="Filtros">
      <div class="campo">
        <label for="f-estado">Estado</label>
        <select id="f-estado" name="estado" class="input"><option value="">Todos los estados</option><option value="PENDIENTE">Pendiente</option><option value="ACEPTADA">Aceptada</option><option value="ENTREGADA">Entregada</option><option value="DEVUELTA">Devuelta</option><option value="RECHAZADA">Rechazada</option><option value="VENCIDA">Vencida</option></select>
      </div>
      <div class="campo">
        <label for="f-cliente">Id de cliente</label>
        <input id="f-cliente" name="clienteId" type="number" min="1" class="input" inputmode="numeric">
      </div>
      <div class="campo">
        <label for="f-herramienta">Id de herramienta</label>
        <input id="f-herramienta" name="herramientaId" type="number" min="1" class="input" inputmode="numeric">
      </div>
      <div class="campo">
        <label for="f-desde">Desde</label>
        <input id="f-desde" name="desde" type="date" class="input">
      </div>
      <div class="campo">
        <label for="f-hasta">Hasta</label>
        <input id="f-hasta" name="hasta" type="date" class="input">
      </div>
      <div class="acciones"><button class="btn btn--secundario" type="submit">Filtrar</button><button class="btn btn--fantasma" type="button" id="limpiar">Limpiar</button></div>
    </form>
    <section style="margin-top:1.5rem" aria-label="Listado de reservas"><div id="lista"></div></section>
  </main>

  <footer id="pie"></footer>
</body>
</html>
